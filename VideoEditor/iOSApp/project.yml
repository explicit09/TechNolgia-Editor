name: ShortsDistribution
options:
  bundleIdPrefix: com.videoeditor
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
targets:
  ShortsDistribution:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: App
      - path: AppIntents
      - path: Config
      - path: Models
      - path: Networking
      - path: Cache
      - path: Rendering
      - path: Views
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/technolgia_logo_tight.png
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TechNolgia
        UILaunchStoryboardName: ""
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryAddUsageDescription: "Save shorts to Photos for sharing"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videoeditor.shorts
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: 5.9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ShortsDistribution:
    build:
      targets:
        ShortsDistribution: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
