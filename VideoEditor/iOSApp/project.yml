name: ShortsDistribution
options:
  bundleIdPrefix: com.videoeditor
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  ShortsDistribution:
    type: application
    supportedDestinations: [iOS, iOS Simulator]
    sources:
      - path: App
      - path: AppIntents
      - path: Config
      - path: Models
      - path: Networking
      - path: Cache
      - path: Rendering
      - path: Views
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/technolgia_logo_tight.png
        buildPhase: resources
    dependencies:
      - package: supabase-swift
        product: Supabase
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TechNolgia
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryAddUsageDescription: "Save shorts to Photos for sharing"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.videoeditor.shorts.linkedin
            CFBundleURLSchemes:
              - com.videoeditor.shorts
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.videoeditor.shorts.youtube
            CFBundleURLSchemes:
              - com.googleusercontent.apps.REPLACE_WITH_CLIENT_ID
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videoeditor.shorts
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: 5.9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 5986DKD528
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
  ShortsDistributionTests:
    type: bundle.unit-test
    supportedDestinations: [iOS Simulator]
    sources:
      - path: Tests
    dependencies:
      - target: ShortsDistribution
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videoeditor.shorts.tests
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: 5986DKD528

schemes:
  ShortsDistribution:
    build:
      targets:
        ShortsDistribution: all
        ShortsDistributionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShortsDistributionTests
    profile:
      config: Release
    analyze:
      config: Debug
